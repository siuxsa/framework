<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSHUNTER — Login</title>
  <meta name="description" content="Secure login for CSHUNTER Advanced Operations Center." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1   : #141518;
      --bg2   : #1a1c1f;
      --bg3   : #212429;
      --border: rgba(255,255,255,.08);
      --cyan  : #ff6a2a;
      --red   : #ef4444;
      --slate4: #94a3b8;
      --slate5: #64748b;
      --slate6: #475569;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg1);
      color: #f2f2f0;
      overflow: hidden;
    }

    /* ── Animated background ──────────────────────────── */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(255,106,42,.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(110,119,129,.05) 0%, transparent 70%);
    }

    /* Moving grid */
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 30s linear infinite;
    }
    @keyframes gridDrift { to { background-position: 60px 60px; } }

    /* ── Page layout ──────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Login card ───────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      box-shadow:
        0 0 0 1px rgba(255,106,42,.06),
        0 32px 80px rgba(0,0,0,.65),
        0 0 80px rgba(255,106,42,.04);
      animation: cardIn .4s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Logo block ───────────────────────────────────── */
    .logo-wrap { text-align: center; margin-bottom: 36px; }

    .logo-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), #e85a1f);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 0 1px rgba(255,106,42,.3), 0 0 32px rgba(255,106,42,.25);
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255,106,42,.3), 0 0 32px rgba(255,106,42,.25); }
      50%       { box-shadow: 0 0 0 1px rgba(255,106,42,.5), 0 0 48px rgba(255,106,42,.4);  }
    }

    .logo-name {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -.03em;
    }
    .logo-name span { color: var(--cyan); }

    .logo-sub {
      font-size: 10px;
      color: var(--slate5);
      text-transform: uppercase;
      letter-spacing: .2em;
      margin-top: 5px;
    }

    /* ── Form ─────────────────────────────────────────── */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--slate5);
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 11px 15px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #f2f2f0;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(255,106,42,.12);
    }
    .field input::placeholder { color: var(--slate6); }

    /* ── Error / info messages ────────────────────────── */
    .msg {
      font-size: 11px;
      min-height: 18px;
      margin-bottom: 16px;
      padding: 0 2px;
      line-height: 1.5;
    }
    .msg.error   { color: var(--red); }
    .msg.loading { color: var(--slate4); font-style: italic; }

    /* ── Submit button ────────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--cyan);
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, box-shadow .15s, transform .1s;
      position: relative;
    }
    .btn-login:hover:not(:disabled) {
      background: #ff8551;
      box-shadow: 0 0 28px rgba(255,106,42,.45);
    }
    .btn-login:active:not(:disabled) { transform: scale(.98); }
    .btn-login:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    /* ── Security notice ──────────────────────────────── */
    .notice {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9.5px;
      color: var(--slate6);
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .notice svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <main class="page">
    <div class="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="logo-name">CS<span>HUNTER</span></div>
        <div class="logo-sub">Advanced Operations Center</div>
      </div>

      <!-- Login form -->
      <form id="login-form" onsubmit="handleLogin(event)" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text"
                 autocomplete="username"
                 placeholder="Enter username"
                 required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password"
                 autocomplete="current-password"
                 placeholder="Enter password"
                 required />
        </div>

        <div id="login-msg" class="msg"></div>

        <button id="login-btn" type="submit" class="btn-login">
          Sign in
        </button>
      </form>

      <!-- Security notice -->
      <div class="notice">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Restricted access — authorised personnel only
      </div>

    </div>
  </main>

  <script>
    // ── If already authenticated redirect to dashboard immediately ──────
    (function checkExistingSession() {
      const token = localStorage.getItem('cshunter_token');
      if (!token) return;
      fetch('/api/auth/check', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(r => {
        if (r.ok) window.location.replace('/');
      }).catch(() => {
        // token invalid or network error — stay on login page
        localStorage.removeItem('cshunter_token');
      });
    })();

    // ── Login handler ───────────────────────────────────────────────────
    async function handleLogin(e) {
      e.preventDefault();

      const usernameEl = document.getElementById('login-username');
      const passwordEl = document.getElementById('login-password');
      const msgEl      = document.getElementById('login-msg');
      const btn        = document.getElementById('login-btn');

      const username = usernameEl.value.trim();
      const password = passwordEl.value;

      msgEl.className = 'msg';
      msgEl.textContent = '';

      if (!username || !password) {
        msgEl.className  = 'msg error';
        msgEl.textContent = 'Please enter both username and password.';
        return;
      }

      btn.disabled     = true;
      msgEl.className  = 'msg loading';
      msgEl.textContent = 'Authenticating…';

      try {
        const r = await fetch('/api/auth/login', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ username, password }),
        });
        const data = await r.json();

        if (r.ok && data.token) {
          localStorage.setItem('cshunter_token', data.token);
          msgEl.className  = 'msg loading';
          msgEl.textContent = 'Authenticated — redirecting…';
          // Small delay so the message is visible
          setTimeout(() => window.location.replace('/'), 300);
        } else {
          msgEl.className  = 'msg error';
          msgEl.textContent = data.detail || 'Invalid credentials. Please try again.';
          btn.disabled = false;
          passwordEl.value = '';
          passwordEl.focus();
        }
      } catch {
        msgEl.className  = 'msg error';
        msgEl.textContent = 'Connection error — server may be unreachable.';
        btn.disabled = false;
      }
    }

    // Focus username input on load
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-username').focus();
    });
  </script>
</body>
</html>
